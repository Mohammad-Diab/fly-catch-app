<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6EC3F5"/>
      <stop offset="1" stop-color="#C4E9FF"/>
    </linearGradient>
    <radialGradient id="body" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#5C5C6A"/>
      <stop offset=".55" stop-color="#2E2E37"/>
      <stop offset="1" stop-color="#18181D"/>
    </radialGradient>
    <radialGradient id="eye" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#F0665A"/>
      <stop offset=".6" stop-color="#B8302A"/>
      <stop offset="1" stop-color="#7A1B17"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="1" stop-color="#CFE8FF" stop-opacity=".4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#sky)"/>
  <ellipse cx="262" cy="300" rx="128" ry="146" fill="#1D4E72" opacity=".22" filter="url(#shadow)"/>

  <g transform="translate(256 236) scale(1.06) translate(-256 -256)">
    <!-- legs -->
    <g fill="none" stroke="#24242B" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
      <path d="M230 230 L184 190 L156 196"/><path d="M282 230 L328 190 L356 196"/>
      <path d="M222 256 L150 246 L112 266"/><path d="M290 256 L362 246 L400 266"/>
      <path d="M232 300 L208 362 L218 414"/><path d="M280 300 L304 362 L294 414"/>
    </g>

    <!-- abdomen with stripes -->
    <ellipse cx="256" cy="318" rx="56" ry="84" fill="url(#body)"/>
    <g fill="none" stroke="#6A6A78" stroke-width="7" stroke-linecap="round" opacity=".8">
      <path d="M208 296 Q256 310 304 296"/>
      <path d="M206 328 Q256 342 306 328"/>
      <path d="M216 360 Q256 372 296 360"/>
    </g>

    <!-- thorax -->
    <ellipse cx="256" cy="238" rx="50" ry="44" fill="url(#body)"/>
    <path d="M242 206 V266 M270 206 V266" stroke="#55555F" stroke-width="6" stroke-linecap="round"/>

    <!-- head and eyes -->
    <circle cx="256" cy="180" r="42" fill="url(#body)"/>
    <ellipse cx="224" cy="168" rx="31" ry="35" fill="url(#eye)"/>
    <ellipse cx="288" cy="168" rx="31" ry="35" fill="url(#eye)"/>
    <circle cx="214" cy="154" r="10" fill="#FFFFFF" opacity=".92"/>
    <circle cx="278" cy="154" r="10" fill="#FFFFFF" opacity=".92"/>
    <circle cx="230" cy="180" r="4" fill="#FFFFFF" opacity=".6"/>
    <circle cx="294" cy="180" r="4" fill="#FFFFFF" opacity=".6"/>

    <!-- wings with veins -->
    <g stroke="#5E80A3" stroke-linecap="round">
      <ellipse cx="174" cy="292" rx="46" ry="102" transform="rotate(36 174 292)" fill="url(#wing)" stroke-width="5"/>
      <path d="M230 214 Q176 286 120 360 M224 230 Q176 256 128 282 M222 250 Q186 320 162 368" fill="none" stroke-width="3.5" opacity=".7"/>
      <ellipse cx="338" cy="292" rx="46" ry="102" transform="rotate(-36 338 292)" fill="url(#wing)" stroke-width="5"/>
      <path d="M282 214 Q336 286 392 360 M288 230 Q336 256 384 282 M290 250 Q326 320 350 368" fill="none" stroke-width="3.5" opacity=".7"/>
    </g>
  </g>
</svg>
