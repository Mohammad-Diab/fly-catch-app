<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8A5327">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="صيد الذباب">
<title>صيد الذباب · Fly Catcher</title>
<meta name="description" content="لعبة للأطفال: اصطد الذباب، خذ كل فراشة إلى وردتها، وأطعم النمل. تعمل بدون إنترنت، بلا إعلانات. A game for kids: catch the flies, take each butterfly to its flower, and feed the ants. Works offline, no ads.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="صيد الذباب · Fly Catcher">
<meta property="og:title" content="صيد الذباب · Fly Catcher">
<meta property="og:description" content="لعبة للأطفال: اصطد الذباب، خذ كل فراشة إلى وردتها، وأطعم النمل. تعمل بدون إنترنت، بلا إعلانات. A game for kids: catch the flies, take each butterfly to its flower, and feed the ants. Works offline, no ads.">
<meta property="og:url" content="https://mohammad-diab.github.io/fly-catch-app/">
<meta property="og:image" content="https://mohammad-diab.github.io/fly-catch-app/icons/share.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="صيد الذباب · Fly Catcher: a fly, a butterfly on a flower, a bee and an ant with a sugar cube">
<meta property="og:locale" content="ar_AR">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://mohammad-diab.github.io/fly-catch-app/">
<link rel="preload" href="fonts/baloo-bhaijaan-2-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/baloo-bhaijaan-2-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="mesh" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H11M0 0V11" stroke="rgba(255,255,255,.85)" stroke-width="1.6" fill="none"/>
    </pattern>
    <clipPath id="hoop"><circle cx="80" cy="80" r="62"/></clipPath>
  </defs>
</svg>

<div class="frame">
  <main class="glass" id="glass">
    <div class="outside" aria-hidden="true">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="shape hill h1"></div>
      <div class="shape hill h2"></div>
      <div class="tree"><div class="shape trunk"></div><div class="shape top"></div></div>
      <span class="shape flower" style="--c:#FF6B8A;left:18%;bottom:14%"></span>
      <span class="shape flower" style="--c:#FFD54A;left:26%;bottom:9%"></span>
      <span class="shape flower" style="--c:#FFFFFF;left:34%;bottom:15%"></span>
      <span class="shape flower" style="--c:#B98CF0;left:58%;bottom:7%"></span>
      <span class="shape flower" style="--c:#FF6B8A;left:66%;bottom:12%"></span>
      <canvas class="ground"></canvas>
    </div>
    <div class="halo" id="halo" aria-hidden="true"></div>
    <div class="streaks" aria-hidden="true"></div>
    <div class="shade" id="shade" aria-hidden="true"></div>

    <div class="flora" id="flora"></div>
    <canvas class="stage" id="stage" aria-hidden="true"></canvas>
    <div class="layer" id="layer"></div>
    <div class="fx" id="fx"></div>

    <div class="hud" id="hud">
      <div class="pill level"><span data-i18n="level"></span><b id="lvNum">1</b></div>
      <div class="pill stars" id="stars" data-i18n-aria="caughtAria"></div>
      <div class="hud-btns">
        <button class="pill mute pausebtn" id="pauseBtn" data-i18n-aria="pauseAria">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/></svg>
        </button>
        <button class="pill mute" id="mute"></button>
      </div>
      <div class="cstats" id="cstats">
        <div class="pill cstat" id="cTime"><span>⏱</span><b id="cTimeV">20</b></div>
        <div class="pill cstat"><span data-i18n="points"></span><b id="cScoreV">0</b></div>
        <div class="pill cstat" id="cStreak"><span data-i18n="streak"></span><b id="cStreakV">×1.0</b></div>
      </div>
    </div>

    <div class="banner" id="banner" aria-live="polite"></div>

    <section class="overlay show" id="startScreen">
      <div class="card split menu">
        <div class="card-top">
          <button class="chip hold" id="langBtn" type="button"></button>
          <button class="chip hold news" id="newsBtn" type="button"><i class="cico" data-ico="gift"></i><span data-i18n="newsBtn"></span></button>
        </div>
        <div class="card-intro">
          <div class="hero flying" id="heroFly"></div>
          <h1 data-i18n="title"></h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
        <div class="card-actions">
          <div class="mode-row">
            <button class="big mode" id="startBtn"><i class="ico flying" data-ico="fly"></i><span class="lbl"><span data-i18n="kidsBtn"></span><small data-i18n="kidsSub"></small></span></button>
            <button class="big alt bee" id="beesBtn" data-i18n-aria="beesBtn" data-i18n-title="beesSub"><i class="ico flying" data-ico="bee"></i></button>
          </div>
          <div class="mode-row">
            <button class="big mode butterfly" id="bfBtn"><i class="ico" data-ico="butterfly"></i><span class="lbl"><span data-i18n="bfBtn"></span><small data-i18n="bfSub"></small></span></button>
            <button class="big alt bfpick" id="bfPickBtn" data-i18n-aria="bfPickBtn" data-i18n-title="bfPickSub"><i class="ico" data-ico="flower"></i></button>
          </div>
          <div class="mode-row">
            <button class="big mode ant" id="antBtn"><i class="ico" data-ico="ant"></i><span class="lbl"><span data-i18n="antBtn"></span><small data-i18n="antSub"></small></span></button>
          </div>
          <button class="chip hold mode-alt" id="challengeBtn" type="button"><i class="cico" data-ico="trophy"></i><span data-i18n="chBtn"></span><small data-i18n="chSub"></small></button>
        </div>
        <div class="card-foot">
          <button class="chip hold accent" id="updateBtn" type="button" hidden><i class="cico" data-ico="refresh"></i><span data-i18n="update"></span></button>
          <button class="chip hold accent" id="installBtn" type="button" hidden><i class="cico" data-ico="download"></i><span data-i18n="install"></span></button>
          <p class="ios-hint" id="iosHint" hidden data-i18n="iosHint"></p>
          <p class="ios-hint" id="silentHint" hidden data-i18n="silentHint"></p>
          <div class="foot-line"><span class="ver" dir="ltr"></span><span class="sep" aria-hidden="true">·</span><a class="plink" href="privacy.html" data-i18n="privacy"></a></div>
          <span class="credit" dir="ltr">© 2026 KOD by Mohammad™</span>
        </div>
        <p class="hold-hint" id="holdHint" data-i18n="holdHint"></p>
      </div>
    </section>

    <section class="overlay" id="newsScreen">
      <div class="card news">
        <div class="card-top">
          <button class="chip" id="newsBack" type="button" data-i18n="back"></button>
        </div>
        <div class="card-intro">
          <div class="gift" aria-hidden="true" data-ico="gift"></div>
          <h2 data-i18n="newsTitle"></h2>
        </div>
        <div class="card-actions" id="newsList"></div>
        <div class="card-foot">
          <span class="ver" dir="ltr"></span>
        </div>
      </div>
    </section>

    <section class="overlay" id="endScreen">
      <div class="card split">
        <div class="card-top">
          <button class="chip" id="kidsMenu" type="button" data-i18n="back"></button>
        </div>
        <div class="card-intro">
          <div class="trophy" aria-hidden="true">🏆</div>
          <h2 data-i18n="wellDone"></h2>
          <p data-i18n="allCaught"></p>
        </div>
        <div class="card-actions">
          <button class="big" id="againBtn" data-i18n="again"></button>
        </div>
        <div class="card-foot">
          <span class="ver" dir="ltr"></span>
        </div>
      </div>
    </section>

    <section class="overlay" id="pauseScreen">
      <div class="card">
        <div class="card-top">
          <button class="chip" id="quitBtn" type="button" data-i18n="back"></button>
        </div>
        <div class="card-intro">
          <h2 data-i18n="paused"></h2>
        </div>
        <div class="card-actions">
          <button class="big" id="resumeBtn" data-i18n="resume"></button>
        </div>
        <div class="card-foot">
          <span class="ver" dir="ltr"></span>
        </div>
      </div>
    </section>

    <section class="overlay" id="chEnd">
      <div class="card split">
        <div class="card-top">
          <button class="chip" id="chMenu" type="button" data-i18n="back"></button>
        </div>
        <div class="card-intro">
          <h2 id="chTitle"></h2>
          <div class="score-big" id="chScore">0</div>
          <p class="best" id="chBest"></p>
        </div>
        <div class="card-actions">
          <div class="grid">
            <div><b id="chAcc">0%</b><span data-i18n="acc"></span></div>
            <div><b id="chStreak">0</b><span data-i18n="bestStreak"></span></div>
            <div><b id="chLevel">1</b><span data-i18n="reached"></span></div>
            <div><b id="chBonus">0</b><span data-i18n="bonus"></span></div>
          </div>
          <button class="big" id="chAgain" data-i18n="again"></button>
        </div>
        <div class="card-foot">
          <span class="ver" dir="ltr"></span>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="js/game.js"></script>
</body>
</html>
