<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8A5327">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="mesh" width="11" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H11M0 0V11" stroke="rgba(255,255,255,.85)" stroke-width="1.6" fill="none"/>
    </pattern>
    <clipPath id="hoop"><circle cx="80" cy="80" r="62"/></clipPath>
  </defs>
</svg>

<div class="frame">
  <main class="glass" id="glass">
    <div class="outside" aria-hidden="true">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="hill h1"></div>
      <div class="hill h2"></div>
      <div class="tree"><div class="trunk"></div><div class="top"></div></div>
      <span class="flower" style="--c:#FF6B8A;left:18%;bottom:14%"></span>
      <span class="flower" style="--c:#FFD54A;left:26%;bottom:9%"></span>
      <span class="flower" style="--c:#FFFFFF;left:34%;bottom:15%"></span>
      <span class="flower" style="--c:#B98CF0;left:58%;bottom:7%"></span>
      <span class="flower" style="--c:#FF6B8A;left:66%;bottom:12%"></span>
    </div>
    <div class="halo" id="halo" aria-hidden="true"></div>
    <div class="streaks" aria-hidden="true"></div>
    <div class="shade" id="shade" aria-hidden="true"></div>

    <div class="flora" id="flora"></div>
    <div class="layer" id="layer"></div>
    <div class="fx" id="fx"></div>

    <div class="hud" id="hud">
      <div class="pill level"><span data-i18n="level"></span><b id="lvNum">1</b></div>
      <div class="pill stars" id="stars" data-i18n-aria="caughtAria"></div>
      <div class="hud-btns">
        <button class="pill mute pausebtn" id="pauseBtn" data-i18n-aria="pauseAria">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.6" fill="currentColor"/></svg>
        </button>
        <button class="pill mute" id="mute"></button>
      </div>
      <div class="cstats" id="cstats">
        <div class="pill cstat" id="cTime"><span>⏱</span><b id="cTimeV">20</b></div>
        <div class="pill cstat"><span data-i18n="points"></span><b id="cScoreV">0</b></div>
        <div class="pill cstat" id="cStreak"><span data-i18n="streak"></span><b id="cStreakV">×1.0</b></div>
      </div>
    </div>

    <div class="banner" id="banner" aria-live="polite"></div>

    <section class="overlay show" id="startScreen">
      <div class="card split menu">
        <div class="card-top">
          <button class="chip hold" id="langBtn" type="button"></button>
        </div>
        <div class="card-intro">
          <div class="hero flying" id="heroFly"></div>
          <h1 data-i18n="title"></h1>
          <p class="tagline" data-i18n="tagline"></p>
        </div>
        <div class="card-actions">
          <button class="big mode" id="startBtn"><i class="ico flying" data-ico="fly"></i><span class="lbl"><span data-i18n="kidsBtn"></span><small data-i18n="kidsSub"></small></span></button>
          <button class="big mode bee" id="beesBtn"><i class="ico flying" data-ico="bee"></i><span class="lbl"><span data-i18n="beesBtn"></span><small data-i18n="beesSub"></small></span></button>
          <button class="chip hold mode-alt" id="challengeBtn" type="button"><i class="cico" data-ico="trophy"></i><span data-i18n="chBtn"></span><small data-i18n="chSub"></small></button>
        </div>
        <div class="card-foot">
          <button class="chip hold accent" id="installBtn" type="button" hidden><i class="cico" data-ico="download"></i><span data-i18n="install"></span></button>
          <p class="ios-hint" id="iosHint" hidden data-i18n="iosHint"></p>
          <p class="ios-hint" id="silentHint" hidden data-i18n="silentHint"></p>
          <span class="ver" dir="ltr"></span>
        </div>
        <p class="hold-hint" id="holdHint" data-i18n="holdHint"></p>
      </div>
    </section>

    <section class="overlay" id="endScreen">
      <div class="card split">
        <div class="card-top">
          <button class="chip" id="kidsMenu" type="button" data-i18n="back"></button>
        </div>
        <div class="card-intro">
          <div class="trophy" aria-hidden="true">🏆</div>
          <h2 data-i18n="wellDone"></h2>
          <p data-i18n="allCaught"></p>
        </div>
        <div class="card-actions">
          <button class="big" id="againBtn" data-i18n="again"></button>
        </div>
        <div class="card-foot">
          <span class="ver" dir="ltr"></span>
        </div>
      </div>
    </section>

    <section class="overlay" id="pauseScreen">
      <div class="card">
        <div class="card-top">
          <button class="chip" id="quitBtn" type="button" data-i18n="back"></button>
        </div>
        <div class="card-intro">
          <h2 data-i18n="paused"></h2>
        </div>
        <div class="card-actions">
          <button class="big" id="resumeBtn" data-i18n="resume"></button>
        </div>
        <div class="card-foot">
          <span class="ver" dir="ltr"></span>
        </div>
      </div>
    </section>

    <section class="overlay" id="chEnd">
      <div class="card split">
        <div class="card-top">
          <button class="chip" id="chMenu" type="button" data-i18n="back"></button>
        </div>
        <div class="card-intro">
          <h2 id="chTitle"></h2>
          <div class="score-big" id="chScore">0</div>
          <p class="best" id="chBest"></p>
        </div>
        <div class="card-actions">
          <div class="grid">
            <div><b id="chAcc">0%</b><span data-i18n="acc"></span></div>
            <div><b id="chStreak">0</b><span data-i18n="bestStreak"></span></div>
            <div><b id="chLevel">1</b><span data-i18n="reached"></span></div>
            <div><b id="chBonus">0</b><span data-i18n="bonus"></span></div>
          </div>
          <button class="big" id="chAgain" data-i18n="again"></button>
        </div>
        <div class="card-foot">
          <span class="ver" dir="ltr"></span>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="js/game.js"></script>
</body>
</html>
