<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- التثبيت كتطبيق -->
<meta name="theme-color" content="#8A5327">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="صيد الذباب">
<title>صيد الذباب · Fly Catcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);

    --sky-top:#7CC8F7; --sky-bot:#DFF4FF;
    --sun:#FFD54A; --sun-glow:rgba(255,213,74,.42);
    --cloud:#FFFFFF;
    --hill-far:#9ED98B; --hill-near:#6CC26A;
    --tree:#3F9B53; --trunk:#8A5A3B;
    --wood-light:#D9985A; --wood:#B9773F; --wood-dark:#8A5327;
    --panel:#FFFAF0; --panel-a:rgba(255,250,240,.9);
    --ink:#3A2A1F; --ink-soft:#6B5646;
    --net:#FF7A3D; --net-soft:#FFB07A;
    --good:#45C46B; --good-dark:#2F9A4F;
    --star:#FFC93C; --star-empty:rgba(58,42,31,.18);
    --streak:rgba(255,255,255,.24);
    --halo:rgba(255,236,160,.55);
    --tile:rgba(58,42,31,.07);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sky-top:#1D2A5B; --sky-bot:#5A4A8A;
      --sun:#F3F0D8; --sun-glow:rgba(243,240,216,.22);
      --cloud:rgba(255,255,255,.34);
      --hill-far:#2F5B4A; --hill-near:#264A3C;
      --tree:#1F4A33; --trunk:#4A3322;
      --wood-light:#8A5A33; --wood:#6E4526; --wood-dark:#4A2C16;
      --panel:#2A2238; --panel-a:rgba(42,34,56,.9);
      --ink:#FFF4E6; --ink-soft:#D9C9B8;
      --star-empty:rgba(255,244,230,.22);
      --streak:rgba(255,255,255,.1);
      --halo:rgba(226,234,255,.32);
      --tile:rgba(255,244,230,.08);
    }
  }
  :root[data-theme="dark"]{
    --sky-top:#1D2A5B; --sky-bot:#5A4A8A;
    --sun:#F3F0D8; --sun-glow:rgba(243,240,216,.22);
    --cloud:rgba(255,255,255,.34);
    --hill-far:#2F5B4A; --hill-near:#264A3C;
    --tree:#1F4A33; --trunk:#4A3322;
    --wood-light:#8A5A33; --wood:#6E4526; --wood-dark:#4A2C16;
    --panel:#2A2238; --panel-a:rgba(42,34,56,.9);
    --ink:#FFF4E6; --ink-soft:#D9C9B8;
    --star-empty:rgba(255,244,230,.22);
    --streak:rgba(255,255,255,.1);
    --halo:rgba(226,234,255,.32);
    --tile:rgba(255,244,230,.08);
  }

  *,*::before,*::after{box-sizing:inherit}
  html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--wood-dark)}
  body{
    margin:0;height:100%;overflow:hidden;
    background:var(--wood-dark);color:var(--ink);
    font-family:"Baloo Bhaijaan 2","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  }

  /* ================= الشبّاك ================= */
  .frame{
    height:100%;padding:clamp(8px,2.2vmin,18px);
    background:linear-gradient(135deg,var(--wood-light),var(--wood) 42%,var(--wood-dark));
  }
  .glass{
    position:relative;height:100%;overflow:hidden;touch-action:none;
    border-radius:clamp(10px,2vmin,18px);
    background:linear-gradient(var(--sky-top),var(--sky-bot));
    box-shadow:inset 0 0 0 3px rgba(0,0,0,.18),inset 0 10px 26px rgba(0,0,0,.24);
  }

  /* المنظر خلف الزجاج */
  .outside{position:absolute;inset:0;pointer-events:none;filter:blur(1.4px) saturate(1.05)}
  .sun{
    position:absolute;top:11%;left:9%;width:clamp(66px,15vmin,140px);aspect-ratio:1;border-radius:50%;
    background:var(--sun);box-shadow:0 0 0 14px var(--sun-glow),0 0 70px 30px var(--sun-glow);
  }
  .cloud{
    position:absolute;left:0;height:clamp(26px,6vmin,46px);border-radius:999px;background:var(--cloud);
    animation:drift linear infinite;
  }
  .cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:var(--cloud)}
  .cloud::before{width:48%;aspect-ratio:1;left:14%;bottom:30%}
  .cloud::after{width:36%;aspect-ratio:1;right:16%;bottom:24%}
  .c1{top:16%;width:clamp(110px,24vmin,200px);animation-duration:90s;animation-delay:-20s}
  .c2{top:30%;width:clamp(80px,17vmin,150px);animation-duration:120s;animation-delay:-70s;opacity:.85}
  @keyframes drift{from{transform:translateX(-110%)}to{transform:translateX(calc(100vw + 10%))}}
  .hill{position:absolute;border-radius:50%}
  .h1{width:150%;height:62%;left:-40%;bottom:-32%;background:var(--hill-far)}
  .h2{width:130%;height:52%;right:-45%;bottom:-30%;background:var(--hill-near)}
  .tree{position:absolute;right:12%;bottom:18%;width:clamp(70px,15vmin,130px);aspect-ratio:.8}
  .tree .trunk{position:absolute;left:44%;bottom:0;width:12%;height:42%;background:var(--trunk);border-radius:4px}
  .tree .top{position:absolute;inset:0 0 30% 0;border-radius:50%;background:var(--tree)}
  .flower{position:absolute;width:clamp(8px,1.6vmin,14px);aspect-ratio:1;border-radius:50%;background:var(--c)}

  /* الإضاءة: الغيمة قدام الشمس بتخفف الضوء — بس المنظر، مش الحشرات */
  .halo{position:absolute;pointer-events:none;border-radius:50%;left:0;top:0;
    background:radial-gradient(circle,var(--halo) 0%,transparent 68%);transition:opacity .35s linear}
  .shade{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:linear-gradient(rgb(30,45,85),rgb(45,60,95));transition:opacity .35s linear}
  .streaks{transition:opacity .35s linear;
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(115deg,transparent 17%,var(--streak) 18%,var(--streak) 22%,transparent 23%,
                      transparent 28%,var(--streak) 29%,transparent 30.5%),
      linear-gradient(115deg,transparent 61%,var(--streak) 62%,var(--streak) 63.5%,transparent 64.5%);
  }

  .layer,.fx,.flora{position:absolute;inset:0;pointer-events:none}
  .bflower{position:absolute;left:0;top:0;transform-origin:50% 100%;animation:bloom .7s cubic-bezier(.2,1.5,.4,1) both}
  .bflower svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 6px 5px rgba(0,0,0,.18))}
  .bflower.wilt{animation:wilt .6s ease-in forwards}
  @keyframes bloom{from{transform:scale(0) rotate(-12deg);opacity:.2}to{transform:scale(1) rotate(0);opacity:1}}
  @keyframes wilt{to{transform:scale(0) rotate(10deg);opacity:0}}
  .fx{z-index:3}

  /* ================= الذبابة ================= */
  .fly{position:absolute;left:0;top:0;width:var(--fly,70px);height:var(--fly,70px);will-change:transform}
  .fly .body{width:100%;height:100%;will-change:transform;
    filter:drop-shadow(0 calc(var(--fly,70px)*.09) calc(var(--fly,70px)*.06) rgba(0,0,0,var(--sha,.28)))}
  .fly svg,.hero svg,.mini svg{width:100%;height:100%;display:block;overflow:visible}
  .wing{transform-origin:50px 44px}
  .flying .wl{animation:flapL .05s linear infinite alternate}
  .flying .wr{animation:flapR .05s linear infinite alternate}
  @keyframes flapL{from{transform:rotate(-6deg);opacity:.95}to{transform:rotate(-56deg);opacity:.5}}
  @keyframes flapR{from{transform:rotate(6deg);opacity:.95}to{transform:rotate(56deg);opacity:.5}}

  .fly.caught svg{animation:squash .46s cubic-bezier(.3,1.7,.5,1)}
  .fly.dodge svg{animation:dodge .4s ease-out}

  /* تنبيه ضرب النحلة: شارة ✕ بتهز راسها «لا»، وأطراف الشاشة بتتوهج */
  .bee-alert{position:absolute;z-index:6;left:0;top:0;transform:translate(-50%,-50%);
    pointer-events:none;text-align:center;animation:alertIn 1.4s cubic-bezier(.2,1.4,.4,1) forwards}
  .bee-alert svg{width:clamp(72px,16vmin,112px);height:auto;display:block;margin:0 auto;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
  .bee-alert span{display:inline-block;margin-top:6px;background:#fff;color:#C2332E;font-weight:800;
    font-size:clamp(18px,4.6vmin,26px);padding:2px 16px 6px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  @keyframes alertIn{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.3)}
    12% {opacity:1;transform:translate(-50%,-50%) scale(1.15)}
    20% {transform:translate(-50%,-50%) scale(1) rotate(-10deg)}
    30% {transform:translate(-50%,-50%) rotate(10deg)}
    40% {transform:translate(-50%,-50%) rotate(-7deg)}
    50% {transform:translate(-50%,-50%) rotate(4deg)}
    58% {transform:translate(-50%,-50%) rotate(0)}
    82% {opacity:1}
    100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}
  }
  .glass::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;border-radius:inherit;
    box-shadow:inset 0 0 0 0 rgba(255,90,90,0);transition:box-shadow .55s ease-out}
  .glass.warn::after{box-shadow:inset 0 0 70px 20px rgba(255,90,90,.42);transition:box-shadow .08s ease-out}
  @keyframes dodge{
    0%{transform:scale(1)} 20%{transform:scale(1.25) rotate(-14deg)}
    45%{transform:scale(.92) rotate(10deg)} 70%{transform:rotate(-6deg)} 100%{transform:scale(1)}
  }
  @keyframes squash{
    0%{transform:scale(1)}
    30%{transform:scale(1.22,.78)}
    55%{transform:scale(.9,1.12) rotate(-6deg)}
    75%{transform:scale(1.04,.97) rotate(4deg)}
    100%{transform:scale(1)}
  }

  /* نجوم الدوخة */
  .dizzy{position:absolute;left:50%;top:18%;width:0;height:0;opacity:0;transition:opacity .2s}
  .fly.dizzy-on .dizzy{opacity:1}
  .dizzy i{
    position:absolute;left:calc(var(--fly,70px)*-.12);top:calc(var(--fly,70px)*-.12);
    width:calc(var(--fly,70px)*.24);aspect-ratio:1;background:var(--star);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    animation:orbit .9s linear infinite;
  }
  .dizzy i:nth-child(2){animation-delay:-.3s}
  .dizzy i:nth-child(3){animation-delay:-.6s}
  @keyframes orbit{
    0%  {transform:translate(0,calc(var(--fly,70px)*-.16)) scale(1)}
    25% {transform:translate(calc(var(--fly,70px)*.3),0) scale(.72)}
    50% {transform:translate(0,calc(var(--fly,70px)*.16)) scale(.5)}
    75% {transform:translate(calc(var(--fly,70px)*-.3),0) scale(.72)}
    100%{transform:translate(0,calc(var(--fly,70px)*-.16)) scale(1)}
  }

  /* ================= الشبكة والمؤثرات ================= */
  .net{position:absolute;left:0;top:0;transform-origin:40% 40%;will-change:transform,opacity}
  .net svg{width:100%;height:100%;display:block;overflow:visible}
  .cursor-net{opacity:.9;transition:opacity .12s}
  .cursor-net.away{opacity:0}
  /* يُفعَّل بحركة الماوس الفعلية، مش بنوع الجهاز — ليشتغل على اللابتوب اللمسي */
  .glass.aiming{cursor:none}

  .ring{position:absolute;width:var(--fly,70px);height:var(--fly,70px);
    margin:calc(var(--fly,70px)*-.5) 0 0 calc(var(--fly,70px)*-.5);
    border-radius:50%;border:4px solid #fff;animation:ring .5s ease-out forwards}
  @keyframes ring{from{transform:scale(.3);opacity:.95}to{transform:scale(1.8);opacity:0}}
  .spark{position:absolute;width:calc(var(--fly,70px)*.28);height:calc(var(--fly,70px)*.28);
    margin:calc(var(--fly,70px)*-.14) 0 0 calc(var(--fly,70px)*-.14);background:var(--c);
    clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    animation:spark .7s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes spark{
    from{transform:translate(0,0) scale(.3) rotate(0);opacity:1}
    to{transform:translate(var(--dx),var(--dy)) scale(1) rotate(170deg);opacity:0}
  }

  .spark.big{animation-duration:.9s}
  .combo{
    position:absolute;z-index:4;transform:translate(-50%,-50%);text-align:center;
    pointer-events:none;white-space:nowrap;color:#fff;
    text-shadow:0 3px 0 #FF7A3D,0 0 18px rgba(255,122,61,.55);
    animation:combo 1.5s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  .combo b{display:block;font-weight:800;font-size:clamp(46px,13vmin,84px);line-height:1}
  .combo span{display:block;font-weight:800;font-size:clamp(22px,6vmin,36px);line-height:1.2}
  @keyframes combo{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-10deg)}
    16%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(4deg)}
    28%{transform:translate(-50%,-50%) scale(1) rotate(0)}
    78%{opacity:1;transform:translate(-50%,-80%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-120%) scale(.9)}
  }

  /* ================= الشريط العلوي ================= */
  .hud{
    position:absolute;top:0;left:0;right:0;z-index:10;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:clamp(8px,2vmin,14px);pointer-events:none;
  }
  .hud > *{pointer-events:auto}
  .hud{flex-wrap:wrap}
  .cstats{display:none;flex-basis:100%;justify-content:center;gap:8px}
  body.challenge .cstats{display:flex}
  .cstat{display:flex;align-items:baseline;gap:6px;padding:4px 14px 6px;font-weight:600;
    font-size:clamp(14px,3.4vmin,19px);white-space:nowrap}
  .cstat b{font-weight:800;font-size:1.3em;font-variant-numeric:tabular-nums}
  .cstat.low{background:#FF5A5A;color:#fff;animation:beat .5s ease-in-out infinite alternate}
  .cstat.hot b{color:var(--net)}
  @keyframes beat{to{transform:scale(1.08)}}
  .pts{position:absolute;z-index:4;transform:translate(-50%,-50%);pointer-events:none;white-space:nowrap;
    font-weight:800;font-size:clamp(22px,6vmin,34px);color:#fff;
    text-shadow:0 2px 0 rgba(0,0,0,.28),0 0 10px rgba(0,0,0,.22);animation:ptsUp 1s ease-out forwards}
  @keyframes ptsUp{
    0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}
    15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}
    100%{opacity:0;transform:translate(-50%,-190%) scale(1)}
  }
  .b-time{font-weight:800;font-size:clamp(18px,4.6vmin,26px);color:var(--good-dark);margin-top:2px}
  .pill{
    background:var(--panel-a);color:var(--ink);border-radius:999px;
    box-shadow:0 4px 0 rgba(0,0,0,.12);
  }
  .level{display:flex;align-items:baseline;gap:6px;padding:4px 14px 6px;font-weight:600;
    font-size:clamp(14px,3.4vmin,19px);white-space:nowrap}
  .level b{font-weight:800;font-size:1.35em;line-height:1}
  .stars{display:flex;gap:clamp(2px,.7vmin,5px);padding:7px 12px;flex-wrap:wrap;justify-content:center;min-width:0}
  .star{width:clamp(14px,3.6vmin,28px);aspect-ratio:1}
  .stars.many .star{width:clamp(11px,2.7vmin,22px)}
  .star svg{width:100%;height:100%;display:block;fill:var(--star-empty)}
  .star.on svg{fill:var(--star)}
  .star.pop svg{animation:starPop .5s cubic-bezier(.2,1.9,.4,1)}
  @keyframes starPop{0%{transform:scale(.3)}60%{transform:scale(1.45)}100%{transform:scale(1)}}
  .hud-btns{display:flex;gap:8px;align-items:center}
  #pauseScreen .modes{margin-top:18px}
  .hud .pausebtn{display:none}                   /* أقوى من قاعدة الزر الدائري اللي بعدها */
  body.playing .hud .pausebtn{display:grid}
  /* الإيقاف: كل حركة بالمشهد بتتجمّد، إلا شاشة الإيقاف نفسها */
  .glass.paused .outside *, .glass.paused .layer *, .glass.paused .fx *,
  .glass.paused .flora *, .glass.paused .banner *{animation-play-state:paused !important}
  .mute{width:clamp(40px,8vmin,48px);aspect-ratio:1;border:0;padding:0;cursor:pointer;
    display:grid;place-items:center;color:var(--ink)}
  .mute svg{width:56%;height:56%;overflow:visible}
  /* إحساس الضغط: بينضغط، بيقفز، ودائرة بتطلع منه */
  .mute{position:relative;transition:transform .12s ease,box-shadow .12s ease,color .2s,opacity .2s}
  .mute:active{transform:scale(.86) translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  .mute.pop{animation:mpop .4s cubic-bezier(.2,1.6,.4,1)}
  @keyframes mpop{0%{transform:scale(.84)}55%{transform:scale(1.16)}100%{transform:scale(1)}}
  .mute::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:3px solid var(--net);
    opacity:0;pointer-events:none}
  .mute.pop::after{animation:mring .5s ease-out}
  @keyframes mring{from{opacity:.85;transform:scale(.8)}to{opacity:0;transform:scale(1.7)}}
  /* الموجات بتنكمش وحدة ورا التانية، والإشارة بتنرسم خط خط */
  .mute .waves path{transform-box:fill-box;transform-origin:left center;
    transition:opacity .2s ease,transform .3s cubic-bezier(.2,1.6,.4,1)}
  .mute .waves path:nth-child(2){transition-delay:.06s}
  .mute.off .waves path{opacity:0;transform:scale(.3)}
  .mute .cross path{stroke-dasharray:8;stroke-dashoffset:8;transition:stroke-dashoffset .22s ease}
  .mute.off .cross path{stroke-dashoffset:0}
  .mute.off .cross path:nth-child(2){transition-delay:.09s}
  .mute.off{color:var(--ink-soft)}
  .mute:focus-visible,.big:focus-visible{outline:4px solid var(--net);outline-offset:4px}

  /* ================= لافتة المرحلة ================= */
  .banner{position:absolute;inset:0;z-index:12;display:grid;place-items:center;pointer-events:none}
  .banner .inner{
    text-align:center;background:var(--panel-a);color:var(--ink);
    padding:14px 30px 18px;border-radius:30px;opacity:0;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
  }
  .banner.show .inner{animation:bannerPop 2s cubic-bezier(.2,1.3,.4,1) forwards}
  @keyframes bannerPop{
    0%{opacity:0;transform:scale(.5)}
    14%{opacity:1;transform:scale(1.06)}
    22%{transform:scale(1)}
    82%{opacity:1;transform:scale(1)}
    100%{opacity:0;transform:scale(.9) translateY(-20px)}
  }
  .b-title{font-weight:800;font-size:clamp(32px,9vmin,58px);line-height:1.1}
  .b-flies{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
  .mini{width:clamp(30px,7vmin,46px);aspect-ratio:1}
  .b-sub{font-weight:600;font-size:clamp(16px,4vmin,22px);color:var(--ink-soft)}

  /* ================= الشاشات ================= */
  .overlay{
    position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:16px;
    background:rgba(20,30,50,.26);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;cursor:auto;overflow:hidden;
  }
  .overlay{pointer-events:none}
  .overlay.show{opacity:1;visibility:visible;pointer-events:auto}
  .card{
    position:relative;z-index:1;background:var(--panel);color:var(--ink);
    border-radius:28px;padding:clamp(20px,5vmin,40px);text-align:center;width:min(92%,440px);
    box-shadow:0 18px 50px rgba(0,0,0,.25),0 6px 0 rgba(0,0,0,.08);
  }
  .card h1,.card h2{font-weight:800;margin:.1em 0 .05em;line-height:1.15}
  .card h1{font-size:clamp(36px,9vmin,58px)}
  .card h2{font-size:clamp(32px,8vmin,50px)}
  .card p{margin:0 0 1em;font-size:clamp(17px,4vmin,22px);color:var(--ink-soft);line-height:1.5}
  .hero{position:relative;width:clamp(90px,24vmin,140px);aspect-ratio:1;margin:0 auto .2em;
    animation:hover 3.2s ease-in-out infinite}
  @keyframes hover{
    0%,100%{transform:translate(-14px,0) rotate(-14deg)}
    25%{transform:translate(0,-10px) rotate(6deg)}
    50%{transform:translate(14px,0) rotate(16deg)}
    75%{transform:translate(0,8px) rotate(-4deg)}
  }
  .trophy{font-size:clamp(54px,14vmin,90px);line-height:1}
  .big{

      s.connect(bp); bp.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .03);

qqqqqq";
  // «لاء» مع كل ضربة غلط، إلا إذا الصوت اللي قبله لسا عم يحكي (حتى ما يتراكب)
  const miss = (() => {
    let buf = null, loading = null, last = -Infinity, lastAny = -Infinity, src = null;
    const gap = () => (buf ? buf.duration * 1000 : 1080) + 150;
    function load() {
      if (buf || loading || !sfx.ctx()) return loading;
      const bin = atob(LAA_MP3.split(",")[1]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      loading = new Promise(res => {
        sfx.ctx().decodeAudioData(bytes.buffer, b => { buf = b; res(b); }, () => res(null));
      });
      return loading;
    }
    return {
      load,
      say() {
        if (muted) return;
        const now = performance.now();
        if (now - lastAny < gap()) return;
        last = lastAny = now;
        if (!buf) { load(); sfx.aww(); return; }
        src = sfx.play(buf, .95);
      },
      sayNow() {
        if (muted) return;
        const now = performance.now();
        if (now - lastAny < gap()) return;
        last = lastAny = now;
        if (LANG !== "ar") { sfx.aww(); return; }              // «لاء» مسجّلة عربي — نغمة لحين تسجيل «No!»
        if (!buf) { load(); sfx.aww(); return; }
        src = sfx.play(buf, .95);
      },
      stop()  { try { if (src) src.stop(); } catch (e) {} src = null; },
      reset() { last = -Infinity; },
    };
  })();

  let flies = [], level = 0, caughtInLevel = 0, running = false, gameOver = false;

  let paused = false, resumeQueue = [];

  let lastKind = "fly";
  function chooseKind() {

    if (last && fliesNow >= LEVELS[level].goal - caughtInLevel) return Math.random() < BEE.chance[level] ? "bee" : null;

    if (lastKind === "bee" && fliesNow === 0) return "fly";
    return Math.random() < BEE.chance[level] ? "bee" : "fly";
  }
  const baseSpeed = () => LEVELS[level].speed * clamp(MIN / 700, .62, 1.15) * (isCh() ? CH.speed : 1);

  /* ================= الذباب ================= */
  function spawnFly(kind = "fly") {
    const el = document.createElement("div");
    el.className = "fly flying" + (kind === "bee" ? " bee" : "");
    el.innerHTML = `<div class="body">${kind === "bee" ? BEE_SVG : FLY_SVG}</div><div class="dizzy"><i></i><i></i><i></i></div>`;
    const pool = SIZES[MODE];
    const sc = pool[Math.floor(Math.random() * pool.length)];
    const Z = S * sc;
    el.style.setProperty("--fly", Z + "px");
    layer.appendChild(el);

    const flower = kind === "bee" ? plantFlower() : null;
    let edge = Math.floor(Math.random() * 4);
    if (flower) edge = flower.x < W / 2 ? 1 : 0;   // من الجنب الأبعد — بتطول رحلتها لعند الوردة
    let x, y;
    if (edge === 0)      { x = -Z;    y = rand(TOP_PAD, H - Z); }
    else if (edge === 1) { x = W + Z; y = rand(TOP_PAD, H - Z); }
    else if (edge === 2) { x = rand(Z, W - Z); y = -Z; }
    else                 { x = rand(Z, W - Z); y = H + Z; }
    let tx = rand(W * .25, W * .75), ty = rand(Math.max(TOP_PAD + Z, H * .3), H * .72);
    if (flower) {                                   // تطلع قبال الوردة وتتجه لها
      y = clamp(flower.y - rand(40, 150), TOP_PAD + Z * .5, H - Z);   // أعلى من الوردة وبتنزل لها
      tx = flower.x; ty = flower.y;
    }
    const heading = Math.atan2(ty - y, tx - x);
    const k = rand(.85, 1.15);

      el, body: el.firstElementChild, x, y, heading, target: heading,
      spdK: k, speed: baseSpeed() * k, turn: rand(.6, 1.2),
      state: "fly", rest: 0, tw: 0, rotTarget: 0, entered: false,
      rot: heading * 180 / Math.PI + 90, t: 0, wob: rand(0, 6.28),

      voice: sfx.voice(kind), vl: -1, vp: 9,

  function step(dt) {
    for (const f of flies) {

      f.t += dt;
      if (f.bump > 0) f.bump -= dt;

          if (f.sip) beeDone(f);
          else if (MODE === "bees" && !isBee(f) && --f.restsLeft <= 0) {
            f.leftNat = true; leave(f, 1.3);                                  // وقفت مرتين-تلاتة: بتطلع
          } else {
            f.state = "fly"; f.el.classList.add("flying");
            f.heading = f.target = rand(0, Math.PI * 2); f.turn = rand(.3, .8);
          }
        }

      } else if (f.state === "slide") {
        // تنزلق على الزجاج: بطيئة أولاً ثم تتسارع
        f.slideT += dt;
        f.vy += 540 * dt;
        f.y += f.vy * dt;
        f.xOff = Math.sin(f.slideT * 8) * 5 * Math.max(0, 1 - f.slideT * .7);
        f.rot = lerpDeg(f.rot, 180, clamp(dt * 2.4, 0, 1));
        if (f.y > H + Z) f.dead = true;

      } else if (f.state === "exit") {
        f.x += Math.cos(f.heading) * f.speed * f.exitK * dt;
        f.y += Math.sin(f.heading) * f.speed * f.exitK * dt;
        f.rot = lerpDeg(f.rot, f.heading * 180 / Math.PI + 90, clamp(dt * 10, 0, 1));
        if (f.x < -Z * 2 || f.x > W + Z * 2 || f.y < -Z * 2 || f.y > H + Z * 2) f.dead = true;
      }

      f.el.style.transform = `translate3d(${f.x + f.xOff - Z / 2}px,${f.y - Z / 2}px,0)`;
      f.body.style.transform = `rotate(${f.rot}deg)`;
    }
    collide();
    if (flies.some(f => f.dead)) {
      const refill = flies.some(f => f.dead && (isBee(f) || f.leftNat));
      flies = flies.filter(f => { if (f.dead) { f.el.remove(); if (f.voice) f.voice.stop(); } return !f.dead; });
      if (refill && running) fill();     // المكان بيفضى لذبابة أو نحلة جديدة
    }
  }

  // اصطدام خفيف: ما حدا بيتداخل بحدا، وكل واحد بيرتد لجهة
  function collide() {
    const act = flies.filter(f => isAlive(f) || f.state === "exit");   // الداخلة والهاربة كمان
    for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
      const a = act[i], c = act[j];
      const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || .001;
      const min = (a.sc + c.sc) * S * .42;
      if (d >= min) continue;
      const aFix = a.sip, cFix = c.sip;                   // النحلة على الوردة ما بتنزاح
      if (aFix && cFix) continue;
      const nx = dx / d, ny = dy / d, push = min - d;
      const wa = aFix ? 0 : cFix ? 1 : .5, wc = cFix ? 0 : aFix ? 1 : .5;
      a.x -= nx * push * wa; a.y -= ny * push * wa;
      c.x += nx * push * wc; c.y += ny * push * wc;
      if (!aFix && !(a.bump > 0)) bounce(a, Math.atan2(-ny, -nx));
      if (!cFix && !(c.bump > 0)) bounce(c, Math.atan2(ny, nx));
    }
  }
  function bounce(f, away) {
    f.heading = f.target = away + rand(-.45, .45);
    f.turn = rand(.5, .9); f.bump = .45;
    if (f.state === "rest") { f.state = "fly"; f.el.classList.add("flying"); }   // اللي واقفة بتطير
  }

  // الوردة
  const flora = $("flora");
  function plantFlower() {
    const F = S * 1.45;
    let x, base, tries = 0;
    do {
      x = rand(W * .12, W * .88);
      base = rand(H * .86, H * .98);                     // جذرها بشريط الأرض الأخضر
    } while (++tries < 12 && flies.some(f => f.flower && Math.abs(f.flower.x - x) < F * 1.1));
    const y = base - F * .75;                            // مركز الوردة
    const el = document.createElement("div");
    el.className = "bflower";
    el.innerHTML = flowerSVG(PETALS[Math.floor(Math.random() * PETALS.length)]);
    el.style.width = F + "px"; el.style.height = F * 1.2 + "px";
    el.style.left = (x - F / 2) + "px"; el.style.top = (base - F * 1.2) + "px";
    flora.appendChild(el);
    sfx.bloom();
    return { x, y, el };
  }
  function wiltFlower(fl) {
    if (!fl) return;
    fl.el.classList.add("wilt");
    setTimeout(() => fl.el.remove(), 650);
  }
  function beeDone(f) {
    f.sip = false; f.phase = "done";
    wiltFlower(f.flower); f.flower = null;
    leave(f, 1.3);
  }

  // الطيران لأقرب حافة
  function leave(f, k) {
    const Z = S * f.sc;
    const dl = f.x, dr = W - f.x, dtp = f.y, db = H - f.y, m = Math.min(dl, dr, dtp, db);
    f.heading = (m === dl ? Math.PI : m === dr ? 0 : m === dtp ? -Math.PI / 2 : Math.PI / 2) + rand(-.3, .3);
    f.state = "exit"; f.exitK = k; f.el.classList.add("flying");
  }
  // تنبيه مرئي لضرب النحلة
  const ALERT_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
    <circle cx="50" cy="50" r="44" fill="#FF5A5A" stroke="#fff" stroke-width="7"/>
    <path d="M34 34 L66 66 M66 34 L34 66" stroke="#fff" stroke-width="11" stroke-linecap="round"/></svg>`;
  let warnT = null;
  function beeAlert(x, y) {
    fx.querySelectorAll(".bee-alert").forEach(n => n.remove());   // وحدة بس بنفس الوقت
    const el = document.createElement("div");
    el.className = "bee-alert";
    el.innerHTML = ALERT_SVG + "<span>" + T("thatsBee") + "</span>";
    el.style.left = clamp(x, 80, W - 80) + "px";
    el.style.top  = clamp(y, TOP_PAD + 70, H - 70) + "px";
    fx.appendChild(el);
    setTimeout(() => el.remove(), 1400);
    glass.classList.add("warn");
    clearTimeout(warnT);
    warnT = setTimeout(() => glass.classList.remove("warn"), 260);
  }

  // النحلة المضروبة: بتفزع وبتهرب بعيد عن الشبكة
  function dodge(f, px, py) {
    f.dodged = true;
    f.sip = false; f.phase = "done";
    wiltFlower(f.flower); f.flower = null;
    f.heading = Math.atan2(f.y - py, f.x - px) + rand(-.25, .25);
    f.state = "exit"; f.exitK = 3.2; f.el.classList.add("flying", "dodge");
  }

  /* ================= الشبكة ================= */
  function sizeNet(el) {
    const k = NET_R / 64;
    el.style.width = el.style.height = (200 * k) + "px";
  }
  function placeNet(el, x, y) {
    const k = NET_R / 64;
    el.style.left = (x - 80 * k) + "px";
    el.style.top  = (y - 80 * k) + "px";
  }
  const cursorNet = document.createElement("div");
  cursorNet.className = "net cursor-net away";
  cursorNet.innerHTML = NET_SVG;
  fx.appendChild(cursorNet);

  // الشبكة تلحق الماوس — ومؤشر النظام يختفي فقط وهي ظاهرة
  let mouseIn = false, overUI = false, swooping = false, lastMouse = null, usingMouse = false;
  function syncCursor() {
    const aim = running && !paused && usingMouse && mouseIn && !overUI;
    glass.classList.toggle("aiming", aim);
    cursorNet.classList.toggle("away", !aim || swooping);
  }
  function netToMouse() {
    if (!lastMouse) return;
    const r = glass.getBoundingClientRect();
    placeNet(cursorNet, lastMouse.x - r.left, lastMouse.y - r.top);
  }

  function swoop(x, y, hit, quick) {
    const el = document.createElement("div");
    el.className = "net";
    el.innerHTML = NET_SVG;
    sizeNet(el); placeNet(el, x, y);
    fx.appendChild(el);
    el.animate([
      { transform: "translate(35%,-45%) rotate(-38deg) scale(1.2)", opacity: 0 },
      { transform: "translate(0,0) rotate(4deg) scale(1)", opacity: 1, offset: .7 },
      { transform: "translate(0,0) rotate(0) scale(.95)", opacity: 1 },
    ], { duration: quick ? 110 : 190, easing: "cubic-bezier(.2,.9,.3,1)", fill: "forwards" });
    setTimeout(() => {
      const out = el.animate([
        { transform: "translate(0,0) rotate(0) scale(.95)", opacity: 1 },
        { transform: "translate(-12%,-35%) rotate(14deg) scale(1.12)", opacity: 0 },
      ], { duration: 260, easing: "cubic-bezier(.5,0,.8,.6)", fill: "forwards" });
      out.onfinish = () => el.remove();
    }, quick ? 150 : 190 + (hit ? 470 : 120));
  }

  // التحدّي بالماوس: الشبكة نفسها بتضرب وبتضل ظاهرة، بلا أي توقف
  function swat() {
    cursorNet.animate([
      { transform: "rotate(-18deg) scale(1.1)" },
      { transform: "rotate(5deg) scale(.9)", offset: .45 },
      { transform: "rotate(0) scale(1)" },
    ], { duration: 150, easing: "cubic-bezier(.2,.9,.3,1)" });
  }

  /* ================= الصيد ================= */
  const SPARK = ["#FFC93C", "#FF6B8A", "#FFFFFF", "#7CD4FF", "#9BE36D"];
  function burst(x, y, Z = S) {
    const ring = document.createElement("span");
    ring.className = "ring"; ring.style.left = x + "px"; ring.style.top = y + "px";
    ring.style.setProperty("--fly", Z + "px");
    fx.appendChild(ring); setTimeout(() => ring.remove(), 560);
    for (let i = 0; i < 8; i++) {
      const s = document.createElement("span");
      const a = (i / 8) * Math.PI * 2 + rand(-.2, .2), d = Z * rand(.75, 1.15);
      s.className = "spark";
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--fly", Z + "px");
      s.style.setProperty("--c", SPARK[i % SPARK.length]);
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      fx.appendChild(s); setTimeout(() => s.remove(), 740);
    }
  }

  function renderTime() {
    const s = Math.max(0, Math.ceil(timeLeft));
    if (s === shownTime) return;
    shownTime = s;
    $("cTimeV").textContent = num(s);
    $("cTime").classList.toggle("low", running && s <= 5);
  }
  function renderStats() {
    $("cScoreV").textContent = num(score);
    const m = Math.min(3, 1 + .1 * streak);
    $("cStreakV").textContent = "×" + ar(m.toFixed(1));
    $("cStreak").classList.toggle("hot", streak >= 5);
    shownTime = -1; renderTime();
  }
  function floatPoints(x, y, pts, below) {
    const el = document.createElement("div");
    el.className = "pts";
    el.textContent = "+" + num(pts);
    el.style.left = clamp(x, 60, W - 60) + "px";
    el.style.top  = clamp(below ? y + NET_R + 34 : y - NET_R - 14, TOP_PAD + 30, H - 40) + "px";
    fx.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }


  function combo(x, y, n) {
    const el = document.createElement("div");
    el.className = "combo";
    el.innerHTML = `<b>${ar(n)}×</b><span>${T("combo")[Math.min(n, 5)]}</span>`;
    el.style.left = clamp(x, 130, W - 130) + "px";
    el.style.top  = clamp(y - S * 1.1, TOP_PAD + 50, H - 70) + "px";
    fx.appendChild(el);
    setTimeout(() => el.remove(), 1500);
    // دائرة نجوم أكبر حول الضربة
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      const a = (i / 14) * Math.PI * 2, d = S * rand(1.5, 2.1);
      s.className = "spark big";
      s.style.left = x + "px"; s.style.top = y + "px";
      s.style.setProperty("--c", SPARK[i % SPARK.length]);
      s.style.setProperty("--dx", Math.cos(a) * d + "px");
      s.style.setProperty("--dy", Math.sin(a) * d + "px");
      fx.appendChild(s); setTimeout(() => s.remove(), 900);
    }
    sfx.combo(n);
  }

  function catchFly(f) {
    f.state = "caught";
    f.el.classList.remove("flying");
    f.el.classList.add("caught");
    f.el.style.zIndex = 3;
    burst(f.x, f.y, S * f.sc);
    const g = gen;
    setTimeout(() => {
      if (g !== gen) return;
      f.state = "slide"; f.vy = 18; f.slideT = 0;
      f.el.classList.remove("caught");
      f.el.classList.add("dizzy-on");
      sfx.squeak();
    }, 480);
  }

  function registerCatch() {
    if (gameOver) return;
    caughtInLevel++;
    renderStars(true);
    if (caughtInLevel >= LEVELS[level].goal) {
      if (level < LEVELS.length - 1) {
        level++; caughtInLevel = 0;
        levelUp();
      } else {
        finish(); return;
      }
    }
    fill();
  }

  function fill() {
    if (gameOver) return;
    let want = LEVELS[level].flies;
    if (MODE !== "bees" && level === LEVELS.length - 1) want = Math.min(want, LEVELS[level].goal - caughtInLevel);
    const need = want - aliveCount();
    for (let i = 0; i < need; i++) {
      pending++;
      const g = gen;
      setTimeout(function go() {
        if (g !== gen) return;
        if (paused) { resumeQueue.push(go); return; }      // بيستنى الاستئناف
        pending--;
        if (gameOver) return;
        const kind = chooseKind();
        if (kind) { lastKind = kind; spawnFly(kind); }
      }, 550 + i * 450 + Math.random() * 300);
    }
  }

  /* ================= الواجهة ================= */
  function renderStars(pop) {
    const goal = LEVELS[level].goal;
    starsEl.classList.toggle("many", goal > 10);
    if (!pop || starsEl.children.length !== goal) {
      starsEl.innerHTML = "";
      for (let i = 0; i < goal; i++) {
        const s = document.createElement("span");
        s.className = "star"; s.innerHTML = STAR_SVG;
        starsEl.appendChild(s);
      }
    }
    [...starsEl.children].forEach((s, i) => {
      if (i < caughtInLevel && !s.classList.contains("on")) {
        s.classList.add("on");
        if (pop) s.classList.add("pop");
      }
    });
  }

  function levelUp() {
    lvNum.textContent = ar(level + 1);
    if (isCh()) { timeLeft += ALLOT[level]; shownTime = -1; renderTime(); }
    const minis = Array.from({ length: LEVELS[level].flies },
      () => `<span class="mini">${FLY_SVG}</span>`).join("");
    banner.innerHTML = `<div class="inner">
        <div class="b-title">${T("cheers")[level] || T("cheers")[1]}</div>
        <div class="b-flies">${minis}</div>
        <div class="b-sub">${T("level")} ${ar(level + 1)}</div>
        ${isCh() ? `<div class="b-time">${T("plusSec")(ar(ALLOT[level]))}</div>` : ""}
      </div>`;
    banner.classList.remove("show");
    void banner.offsetWidth;
    banner.classList.add("show");
    renderStars(false);
    sfx.levelUp();
  }

  function finish(done = true) {
    if (gameOver) return;
    gameOver = true; running = false;
    document.body.classList.remove("playing");
    flies.forEach(f => { f.sip = false; wiltFlower(f.flower); f.flower = null; });
    syncCursor();
    for (const f of flies) {
      if (!isAlive(f)) continue;
      const dl = f.x, dr = W - f.x, dt = f.y, db = H - f.y, m = Math.min(dl, dr, dt, db);
      f.heading = m === dl ? Math.PI : m === dr ? 0 : m === dt ? -Math.PI / 2 : Math.PI / 2;
      f.heading += rand(-.3, .3);
      f.state = "exit"; f.el.classList.add("flying");
    }
    if (isCh()) {
      const bonus = done ? Math.round(timeLeft) * TIME_PTS : 0;
      score += bonus;
      renderStats();
      done ? sfx.win() : sfx.timeUp();
      setTimeout(() => showChEnd(done, bonus), 1000);
    } else {
      sfx.win();
      setTimeout(showEnd, 1000);
    }
  }

  function confetti(box) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const cols = ["#FFC93C", "#FF6B8A", "#45C46B", "#7CD4FF", "#B98CF0", "#FF7A3D"];
    for (let i = 0; i < 70; i++) {
      const c = document.createElement("span");
      c.className = "confetti";
      c.style.left = rand(0, 100) + "%";
      c.style.setProperty("--c", cols[i % cols.length]);
      c.style.setProperty("--x", rand(-80, 80) + "px");
      c.style.setProperty("--r", rand(-720, 720) + "deg");
      c.style.setProperty("--d", rand(2.2, 4.2) + "s");
      c.style.animationDelay = rand(0, .8) + "s";
      box.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
  }

  function showChEnd(done, bonus) {
    let best = 0;
    try { best = +localStorage.getItem("flyCatch.best") || 0; } catch (e) {}
    const isNew = score > best;
    if (isNew) { try { localStorage.setItem("flyCatch.best", String(score)); } catch (e) {} }
    $("chTitle").textContent = done ? T("chDone") : T("timeUp");
    $("chScore").textContent = num(score);
    const bestEl = $("chBest");
    bestEl.textContent = isNew ? (best ? T("newRecord") : T("firstRecord")) : T("best") + num(best);
    bestEl.classList.toggle("new", isNew);
    $("chAcc").textContent = num(swings ? goodSwings / swings * 100 : 0) + T("pct");
    $("chStreak").textContent = num(bestStreak);
    $("chLevel").textContent = num(level + 1);
    $("chBonus").textContent = num(bonus);
    $("chEnd").classList.add("show");
    if (isNew) { sfx.newBest(); confetti($("chEnd")); }
  }

  function showEnd() {
    endScreen.classList.add("show");
    confetti(endScreen);
    const ab = $("againBtn");
    ab.classList.remove("auto"); void ab.offsetWidth; ab.classList.add("auto");
    clearTimeout(endTimer);
    endTimer = setTimeout(() => startGame(MODE), 10000);
  }

  function startGame(mode) {
    if (typeof mode === "string") MODE = mode;
    document.body.classList.toggle("challenge", isCh());
    sfx.init();
    miss.load();
    clearTimeout(endTimer);
    gen++;
    flies.forEach(f => { f.el.remove(); if (f.voice) f.voice.stop(); });
    flies = []; pending = 0;
    flora.innerHTML = "";
    level = 0; caughtInLevel = 0;
    gameOver = false; running = true; paused = false; resumeQueue = [];
    glass.classList.remove("paused"); $("pauseScreen").classList.remove("show");
    document.body.classList.add("playing");
    lvNum.textContent = ar(1);
    miss.reset();
    renderStars(false);
    startScreen.classList.remove("show");
    endScreen.classList.remove("show");
    $("chEnd").classList.remove("show");
    $("againBtn").classList.remove("auto");
    clock = 0; timeLeft = ALLOT[0]; lowTick = -1; lastKind = "fly";
    score = 0; streak = 0; bestStreak = 0; swings = 0; goodSwings = 0;
    renderStats();
    measure();
    overUI = false; netToMouse(); syncCursor();   // الشبكة تظهر فوراً مكان الماوس
    fill();
  }

  /* ================= اللمس ================= */
  glass.addEventListener("pointerdown", e => {
    usingMouse = e.pointerType === "mouse";
    sfx.init();
    if (!running) return;
    if (e.target.closest("button, .overlay.show")) return;
    const r = glass.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const k = isCh() ? CH.reach : .35;
    const inReach = f => Math.hypot(f.x - px, f.y - py) <= NET_R + S * f.sc * k;
    const hits = flies.filter(f => !isBee(f) && (isAlive(f) || leaving(f)) && inReach(f));
    const beeHits = flies.filter(f => isBee(f) && (isAlive(f) || (leaving(f) && !f.dodged)) && inReach(f));

    if (isCh() && e.pointerType === "mouse") {
      swat();                                    // فوري — نفس سرعة اللمس
    } else {
      swoop(px, py, hits.length > 0, isCh());    // بالتحدّي سريعة، وبالعادي بتوقف
      if (e.pointerType === "mouse") {
        swooping = true; syncCursor();
        setTimeout(() => { swooping = false; netToMouse(); syncCursor(); }, hits.length ? 900 : 420);
      }
    }
    sfx.swoosh();
    if (isCh()) {
      swings++;
      if (hits.length) {
        // السرعة: ×٢ خلال ثانية من الظهور، وبتنزل لـ×١ عند ٤ ثواني
        const base = hits.reduce((a, f) =>
          a + 100 * sizePts(f.sc) * (1 + clamp((4 - (clock - (f.born ?? clock))) / 3, 0, 1)), 0);
        const pts = Math.round(base * MULTI[Math.min(5, hits.length)] * Math.min(3, 1 + .1 * streak) / 10) * 10;
        score += pts; streak++; goodSwings++;
        bestStreak = Math.max(bestStreak, streak);
        floatPoints(px, py, pts, hits.length >= 2);
      } else {
        streak = 0;
      }
      renderStats();
    }
    if (hits.length) {
      sfx.caught();
      if (hits.length >= 2) combo(px, py, hits.length);
      hits.forEach(f => { catchFly(f); registerCatch(); });
    }
    // «لاء» صارت محجوزة للنحلة بس — الضربة الفاضية بس صوت الشبكة
    if (beeHits.length) {
      beeAlert(beeHits[0].x, beeHits[0].y);
      beeHits.forEach(f => dodge(f, px, py));
      miss.sayNow();
    }
  });

  glass.addEventListener("pointermove", e => {
    usingMouse = e.pointerType === "mouse";
    if (!usingMouse) { syncCursor(); return; }
    lastMouse = { x: e.clientX, y: e.clientY };
    mouseIn = true;
    overUI = !!e.target.closest("button, .overlay.show");
    netToMouse();
    syncCursor();
  });
  glass.addEventListener("pointerleave", () => { mouseIn = false; syncCursor(); });
  glass.addEventListener("contextmenu", e => e.preventDefault());

  $("startBtn").addEventListener("click", () => startGame("kids"));
  $("challengeBtn").addEventListener("click", () => startGame("challenge"));
  $("againBtn").addEventListener("click", () => startGame(MODE));
  $("beesBtn").addEventListener("click", () => startGame("bees"));
  $("chAgain").addEventListener("click", () => startGame("challenge"));
  // ================= التثبيت كتطبيق =================
  const installBtn = $("installBtn"), iosHint = $("iosHint");
  const installed = () => matchMedia("(display-mode: standalone)").matches ||
    matchMedia("(display-mode: fullscreen)").matches || navigator.standalone === true;
  let installEvt = null;
  addEventListener("beforeinstallprompt", e => {         // أندرويد وكروم/إيدج على الكمبيوتر
    e.preventDefault(); installEvt = e;
    if (!installed()) installBtn.hidden = false;
  });
  installBtn.addEventListener("click", async () => {
    if (!installEvt) return;
    installEvt.prompt();
    try { await installEvt.userChoice; } catch (e) {}
    installEvt = null; installBtn.hidden = true;
  });
  addEventListener("appinstalled", () => { installBtn.hidden = true; iosHint.hidden = true; });
  // آيفون وآيباد بيكتموا أصوات الويب مع الوضع الصامت، والصفحة ما بتقدر تعرف إذا هو شغّال — فبننبّه
  const isAppleTouch = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (isAppleTouch) $("silentHint").hidden = false;
  if ("serviceWorker" in navigator &&
      (location.protocol === "https:" || location.hostname === "localhost" || location.hostname === "127.0.0.1")) {
    navigator.serviceWorker.register("sw.js").then(() => {
      // آيفون وآيباد: آبل ما بتسمح بزر تثبيت، فبنعرض الطريقة — بس إذا الموقع فعلاً قابل للتثبيت
      if (isAppleTouch && !installed()) iosHint.hidden = false;
    }).catch(() => {});
  }

  // ================= الإيقاف المؤقت =================
  function pauseGame() {
    if (!running || paused) return;
    paused = true;
    glass.classList.add("paused");
    $("pauseScreen").classList.add("show");
    miss.stop(); syncCursor();
    setTimeout(() => $("resumeBtn").focus({ preventScroll: true }), 50);
  }
  function resumeGame() {
    if (!paused) return;
    paused = false;
    glass.classList.remove("paused");
    $("pauseScreen").classList.remove("show");
    flies.forEach(f => { f.vl = -1; });                         // يرجع الطنين
    resumeQueue.splice(0).forEach((fn, i) => setTimeout(fn, 300 + i * 350));
    syncCursor();
  }
  function quitGame() {                                          // رجوع للبداية من نص اللعب
    paused = false; resumeQueue = [];
    glass.classList.remove("paused");
    $("pauseScreen").classList.remove("show");
    gen++; pending = 0;
    flies.forEach(f => { f.el.remove(); if (f.voice) f.voice.stop(); });
    flies = []; flora.innerHTML = "";
    running = false; gameOver = true;
    document.body.classList.remove("playing");
    syncCursor(); goStart();
  }
  $("pauseBtn").addEventListener("click", () => {
    $("pauseBtn").classList.remove("pop"); void $("pauseBtn").offsetWidth; $("pauseBtn").classList.add("pop");
    pauseGame();
  });
  $("resumeBtn").addEventListener("click", resumeGame);
  $("quitBtn").addEventListener("click", quitGame);
  addEventListener("keydown", e => {
    if (e.key !== "Escape" && e.key !== "p" && e.key !== "P") return;
    if (paused) resumeGame(); else pauseGame();
  });

  // رجوع للبداية من أي شاشة نهاية — وبيلغي الإعادة التلقائية
  function goStart() {
    clearTimeout(endTimer);
    endScreen.classList.remove("show");
    $("chEnd").classList.remove("show");
    $("againBtn").classList.remove("auto");
    MODE = "kids"; document.body.classList.remove("challenge");
    level = 0; caughtInLevel = 0; lvNum.textContent = ar(1); renderStars(false);
    startScreen.classList.add("show");
    measure();
  }
  $("chMenu").addEventListener("click", goStart);
  $("kidsMenu").addEventListener("click", goStart);

  function applyLang() {
    const html = document.documentElement;
    html.lang = LANG; html.dir = LANG === "ar" ? "rtl" : "ltr";
    document.title = T("title");
    document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = T(e.dataset.i18n); });
    document.querySelectorAll("[data-i18n-aria]").forEach(e => e.setAttribute("aria-label", T(e.dataset.i18nAria)));
    $("langBtn").textContent = T("switchTo");
    $("langBtn").setAttribute("lang", LANG === "ar" ? "en" : "ar");
    lvNum.textContent = ar(level + 1);
    renderMute(); renderStats(); measure();
  }
  $("langBtn").addEventListener("click", () => {
    LANG = LANG === "ar" ? "en" : "ar";
    try { localStorage.setItem("flyCatch.lang", LANG); } catch (e) {}
    applyLang();
  });

  muteBtn.innerHTML = ICON_SPK;
  function renderMute() {
    muteBtn.classList.toggle("off", muted);
    muteBtn.setAttribute("aria-pressed", String(muted));
    muteBtn.setAttribute("aria-label", muted ? T("unmute") : T("mute"));
  }
  muteBtn.addEventListener("click", () => {
    sfx.init();
    muted = !muted;
    renderMute();
    muteBtn.classList.remove("pop"); void muteBtn.offsetWidth; muteBtn.classList.add("pop");
    if (muted) {
      sfx.uiOff();                                               // النغمة قبل ما ينكتم، حتى تنسمع
      setTimeout(() => { if (muted) sfx.setMuted(true); }, 180);
      miss.stop();
    } else {
      sfx.setMuted(false);
      sfx.uiOn();
    }
  });
  renderMute();
  applyLang();

  /* ================= الغيوم والإضاءة ================= */
  const sunEl = document.querySelector(".sun"), cloudEls = [...document.querySelectorAll(".cloud")];
  const haloEl = $("halo"), shadeEl = $("shade"), streaksEl = document.querySelector(".streaks");
  const CLOUD_PX_S = [28, 20];      // سرعة ثابتة بالبكسل: الأولى بتمرق عالشمس، التانية أبطأ للعمق
  const DIM_MAX = .22;              // أقصى إظلام للمنظر (~٢٠٪) — خفيف بس محسوس
  function tuneClouds() {
    cloudEls.forEach((c, i) => {
      const w = c.offsetWidth;       // المسافة = عرض الشاشة + ١.٢ عرض الغيمة (من برّا لبرّا)
      c.style.animationDuration = ((innerWidth + w * 1.2) / CLOUD_PX_S[i]).toFixed(1) + "s";
    });
    const sr = sunEl.getBoundingClientRect(), gr = glass.getBoundingClientRect(), d = sr.width * 3.2;
    haloEl.style.width = haloEl.style.height = d + "px";
    haloEl.style.transform = `translate(${sr.left - gr.left + sr.width / 2 - d / 2}px,${sr.top - gr.top + sr.height / 2 - d / 2}px)`;
  }
  // شكل الغيمة الحقيقي: كبسولة + دائرتين
  function cloudShapes(r) {
    const w = r.width, h = r.height, d1 = .48 * w, d2 = .36 * w;
    return [
      { t: 0, x: r.left, y: r.top, w, h },
      { t: 1, cx: r.left + .14 * w + d1 / 2, cy: r.top + h * .7 - d1 / 2, r: d1 / 2 },
      { t: 1, cx: r.left + w * .84 - d2 / 2, cy: r.top + h * .76 - d2 / 2, r: d2 / 2 },
    ];
  }
  function inShape(px, py, s) {
    if (s.t) return (px - s.cx) ** 2 + (py - s.cy) ** 2 <= s.r * s.r;
    const rr = s.h / 2, qx = clamp(px, s.x + rr, s.x + s.w - rr);
    return (px - qx) ** 2 + (py - (s.y + rr)) ** 2 <= rr * rr;
  }
  let dimNow = -1;
  function sunCover() {                 // كم من قرص الشمس مغطّى (٠ لـ١)
    const sr = sunEl.getBoundingClientRect(), R = sr.width / 2, cx = sr.left + R, cy = sr.top + R;
    const sh = cloudEls.flatMap(c => cloudShapes(c.getBoundingClientRect()));
    let tot = 0, hit = 0; const N = 10;
    for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
      const px = cx - R + (i + .5) * 2 * R / N, py = cy - R + (j + .5) * 2 * R / N;
      if ((px - cx) ** 2 + (py - cy) ** 2 > R * R) continue;
      tot++; if (sh.some(s => inShape(px, py, s))) hit++;
    }
    return tot ? hit / tot : 0;
  }
  function updateLight() {
    const root = document.documentElement;
    const night = root.dataset.theme === "dark" ||
      (root.dataset.theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
    const k = clamp(sunCover() / .75, 0, 1) * (night ? .6 : 1);   // تغطية ٧٥٪ = أقصى إظلام
    if (Math.abs(k - dimNow) < .015) return;
    dimNow = k;
    shadeEl.style.opacity = (k * DIM_MAX).toFixed(3);
    haloEl.style.opacity = (1 - k * .8).toFixed(3);
    streaksEl.style.opacity = (1 - k * .5).toFixed(3);
    glass.style.setProperty("--sha", (.28 - k * .13).toFixed(3));
  }
  tuneClouds();
  addEventListener("resize", tuneClouds);

  /* ================= الحلقة ================= */
  let last = 0, lastLight = 0;
  const FLY_BUZZ = .024;    // علوّ ذبابة وحدة
  const BEE_BUZZ = .0113;   // مقاس: أوضح من ذبابة وحدة بـ٢٥٪ (سلسلة النحلة أعلى بطبيعتها)
  const PAN_MAX  = .7;      // ما بيروح الصوت كله لأذن وحدة — حماية لأذن الطفل مع السماعات
  function frame(t) {
    const dt = Math.min(.05, (t - last) / 1000 || 0);
    last = t;
    if (running && !paused && !document.hidden) {
      clock += dt;
      if (isCh()) {
        timeLeft -= dt;
        const sec = Math.ceil(timeLeft);
        if (sec <= 5 && sec > 0 && sec !== lowTick) { lowTick = sec; sfx.tick(); }
        renderTime();
        if (timeLeft <= 0) { timeLeft = 0; renderTime(); finish(false); }
      }
    }
    if (!paused && !document.hidden && flies.length) step(dt);
    if (t - lastLight > 100) { lastLight = t; updateLight(); }   // ١٠ مرات بالثانية بتكفي
    // كل حشرة: الصوت بيلحق مكانها يمين-يسار، والأكبر أعلى شوي
    for (const f of flies) {
      if (!f.voice) continue;
      const moving = f.state === "fly" || f.state === "exit";
      let lv = paused ? 0 : isBee(f) ? (moving ? BEE_BUZZ : f.sip ? BEE_BUZZ * .4 : 0) : (moving ? FLY_BUZZ : 0);
      lv *= Math.sqrt(f.sc);
      const p = clamp((f.x / W) * 2 - 1, -1, 1) * PAN_MAX;
      if (Math.abs(lv - f.vl) > .0005 || Math.abs(p - f.vp) > .02) { f.vl = lv; f.vp = p; f.voice.set(lv, p); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { pauseGame(); sfx.suspend(); miss.stop(); } else sfx.resume();
  });
  addEventListener("resize", () => {
    measure();
    flies.forEach(f => {
      const b = bounds(S * f.sc * .5);
      if (isAlive(f) && f.entered) { f.x = clamp(f.x, b.minX, b.maxX); f.y = clamp(f.y, b.minY, b.maxY); }
    });
  });

  measure();
  renderStars(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
})();
</script>
</body>
</html>
